apiVersion: flinkflow.io/v1alpha1
kind: Pipeline
metadata:
  name: ml-vector-assembler-example
spec:
  name: "ML VectorAssembler - Sensor Feature Engineering"
  parallelism: 1

  steps:
    # ── SOURCE: Static Sensor Readings ─────────────────────────────────────────
    # Pipe-delimited JSON records representing environmental sensor data.
    - type: source
      name: static-source
      properties:
        content: >
          {"temperature": 23.5, "humidity": 65.0, "pressure": 1013.2}|
          {"temperature": -5.1, "humidity": 88.3, "pressure": 998.7}|
          {"temperature": 37.8, "humidity": 42.1, "pressure": 1025.0}|
          {"temperature": 15.2, "humidity": 71.5, "pressure": 1008.4}|
          {"temperature": 29.0, "humidity": 55.9, "pressure": 1017.6}

    # ── ML: VectorAssembler - Feature Vector Construction ───────────────────────
    # Assembles temperature, humidity, and pressure scalars into a dense
    # feature vector for downstream ML model scoring or clustering.
    #
    # Properties:
    #   algorithm:   Short name (VectorAssembler) or fully-qualified class name
    #   inputCols:   Comma-separated list of input columns (must match schema.* keys)
    #   inputSizes:  Comma-separated sizes for each input column (1 per scalar column)
    #   outputCol:   Name of the assembled feature vector output column
    #   schema.*:    Data types for each input column (double, float, int, long, string, boolean)
    - type: ml
      name: assemble-features
      properties:
        algorithm: "VectorAssembler"
        inputCols: "temperature,humidity,pressure"
        inputSizes: "1,1,1"
        outputCol: "features"
        schema.temperature: "double"
        schema.humidity: "double"
        schema.pressure: "double"

    # ── PROCESS: Annotate output with anomaly flag ──────────────────────────────
    # Parses the assembled JSON and adds a simple threshold-based anomaly label.
    - type: process
      name: anomaly-flag
      code: |
        com.fasterxml.jackson.databind.ObjectMapper mapper = new com.fasterxml.jackson.databind.ObjectMapper();
        com.fasterxml.jackson.databind.node.ObjectNode obj =
            (com.fasterxml.jackson.databind.node.ObjectNode) mapper.readTree(input);
        double temp = obj.get("temperature").asDouble();
        double humidity = obj.get("humidity").asDouble();
        boolean anomaly = temp > 35.0 || humidity > 85.0;
        obj.put("anomaly", anomaly);
        obj.put("status", anomaly ? "ALERT" : "NORMAL");
        return obj.toString();

    # ── SINK: Console Output ────────────────────────────────────────────────────
    - type: sink
      name: console-sink
      properties:
        type: console
