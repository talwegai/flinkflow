# Run: ./scripts/run-local.sh examples/standalone/java/ml-fraud-detection-example.yaml
#
# Demonstrates: Apache Flink ML - Hybrid ML Pipeline for Financial Fraud Detection
#
# Pipeline:
#   1. Static source generates synthetic financial transaction features:
#       - amount: Transaction amount in USD
#       - distance: Distance from cardholder's home address in miles
#       - isMerchantSafe: Binary indicator if the merchant is low-risk (1.0 = safe, 0.0 = high risk)
#   2. A VectorAssembler ml step combines the transaction features into a "rawFeatures" vector
#   3. A MinMaxScaler ml step automatically learns global min/max transaction boundaries and normalises
#      the features into a standard [0.0, 1.0] range under "scaledFeatures"
#   4. A Process step parses the normalised feature vector, computes a weighted fraud risk score,
#      and tags the transaction as fraudulent (prediction: 1.0) if the risk exceeds a safety threshold.
#   5. Console sink prints the transaction details and fraud predictions
#

name: "ML Fraud Detection - Financial Transactions Classification"
parallelism: 1

steps:
  # ── SOURCE: Static Transaction Data ──────────────────────────────────────────
  - type: source
    name: static-source
    properties:
      content: >
        {"amount": 5.50, "distance": 1.2, "isMerchantSafe": 1.0}|
        {"amount": 12.00, "distance": 4.5, "isMerchantSafe": 1.0}|
        {"amount": 950.00, "distance": 850.0, "isMerchantSafe": 0.0}|
        {"amount": 80.00, "distance": 120.0, "isMerchantSafe": 1.0}|
        {"amount": 1500.00, "distance": 2200.0, "isMerchantSafe": 0.0}|
        {"amount": 15.20, "distance": 0.5, "isMerchantSafe": 1.0}

  # ── ML STEP 1: Feature Vector Assembly ───────────────────────────────────────
  - type: ml
    name: assemble-transaction-features
    properties:
      algorithm: "VectorAssembler"
      inputCols: "amount,distance,isMerchantSafe"
      inputSizes: "1,1,1"
      outputCol: "rawFeatures"
      schema.amount: "double"
      schema.distance: "double"
      schema.isMerchantSafe: "double"

  # ── ML STEP 2: Feature Normalisation ─────────────────────────────────────────
  - type: ml
    name: normalise-features
    properties:
      algorithm: "MinMaxScaler"
      inputCol: "rawFeatures"
      outputCol: "scaledFeatures"
      schema.rawFeatures: "vector"

  # ── PROCESS STEP: Risk Scoring and Classification ───────────────────────────
  - type: process
    name: score-fraud-risk
    code: |
      com.fasterxml.jackson.databind.ObjectMapper mapper = new com.fasterxml.jackson.databind.ObjectMapper();
      com.fasterxml.jackson.databind.node.ObjectNode obj =
          (com.fasterxml.jackson.databind.node.ObjectNode) mapper.readTree(input);
      
      // Convert scaledFeatures JSON Array directly to double[] with explicit cast
      double[] scaled = (double[]) mapper.convertValue(obj.get("scaledFeatures"), double[].class);
      double scaledAmount = scaled[0];
      double scaledDistance = scaled[1];
      double scaledMerchantSafe = scaled[2];
      
      // Calculate risk score: high amount and distance add risk, safe merchant reduces risk
      double riskScore = (scaledAmount * 0.4) + (scaledDistance * 0.4) + ((1.0 - scaledMerchantSafe) * 0.2);
      boolean isFraud = riskScore > 0.35;
      
      obj.put("riskScore", riskScore);
      obj.put("prediction", isFraud ? 1.0 : 0.0);
      obj.put("status", isFraud ? "❌ FRAUD_ALERT" : "✅ APPROVED");
      return obj.toString();

  # ── SINK: Console Output ────────────────────────────────────────────────────
  - type: sink
    name: console-sink
